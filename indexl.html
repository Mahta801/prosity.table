
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>جدول تناوبی عناصر</title>

    <link rel="stylesheet" href="12345.css">
</head>

<body>

    <header>
        <h1>جدول تناوبی عناصر</h1>
        <p>دنیای شگفت‌انگیز عناصر شیمیایی</p>
    </header>

    <main>

        <div class="search-box">
            <input
                type="text"
                id="search"
                placeholder="نام یا نماد عنصر را جستجو کنید..."
            >
        </div>

        <div class="table-container">
            <div id="periodic-table" class="periodic-table"></div>
        </div>

        <section id="element-info" class="element-info">
            <h2>یک عنصر را انتخاب کنید</h2>
            <p>برای مشاهده اطلاعات، روی یکی از عناصر کلیک کنید.</p>
        </section>

    </main>

    <script src="کک.js"></script>

</body>
</html>
